<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="produto.css">
</head>
<body>
    <!-- Os cards são gerados aqui a partir de produtos.js -->
    <main id="catalogo" class="catalogo"></main>

    <!-- Modelo de um card de produto -->
    <template id="tpl-produto">
        <article class="produto">
            <h2 class="produto__titulo"></h2>
            <div class="produto__imagem">
                <img class="produto__foto" src="" alt="" loading="lazy">
                <span class="produto__marca" hidden></span>
                <span class="produto__selo" hidden></span>
            </div>
            <table class="produto__tabela">
                <thead>
                    <tr>
                        <th>Cód.</th>
                        <th>Descrição</th>
                        <th>Emb.</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </article>
    </template>

    <script src="produtos.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
